<p>
	<a class="btn-link" routerLink="/monkeys">← Back to list</a>
</p>

<ng-container *ngIf="monkey$ | async as m; else loading">
	<header class="detail-head">
		<h1>{{ m.name }}</h1>
		<div class="chips">
			<span class="pill">{{ m.location }}</span>
			<span class="pill">Population: {{ m.population }}</span>
		</div>
	</header>

	<section class="detail surface">
		<div class="hero-wrap" [style.--hero-bg]="'url(' + m.imageUrl + ')'">
			<img class="hero" [src]="m.imageUrl" [alt]="m.name" />
		</div>
		<div class="facts">
			<div class="fact map">
				<div class="label">Map</div>
				<ng-container *ngIf="m.mapUrl; else mapUnavailable">
					<a class="map-link" [href]="m.osmLink" target="_blank" rel="noopener">
						<img class="map-img" [src]="m.mapUrl" [alt]="'Map near ' + m.location" loading="lazy" />
					</a>
					<div class="map-attrib">
						© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
						contributors
					</div>
				</ng-container>
				<ng-template #mapUnavailable>
					<div class="value">Map unavailable</div>
				</ng-template>
			</div>
			<div class="fact">
				<div class="label">Location</div>
				<div class="value">{{ m.location }}</div>
			</div>
		</div>
	</section>

	<section class="details surface">
		<p>{{ m.details }}</p>
	</section>
</ng-container>

<ng-template #loading>
	<div class="loading surface">
		<div class="loading__bar"></div>
		<p>Loading monkey…</p>
	</div>
</ng-template>
