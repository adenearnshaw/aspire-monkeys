<section class="page-head surface">
	<div>
		<h1>Monkeys</h1>
		<p>Browse the troop, open a profile, and learn a few fun facts.</p>
	</div>
	<div class="page-head__aside">
		<label class="filter">
			<span class="filter__label">Filter</span>
			<input
				class="filter__input"
				type="search"
				placeholder="Name, location, id…"
				autocomplete="off"
				[formControl]="query"
			>
		</label>
	</div>
</section>

<ng-container *ngIf="filteredMonkeys$ | async as monkeys; else loading">
	<p class="result-meta">Showing {{ monkeys.length }} result(s)</p>
	<div class="grid">
		<a class="card" *ngFor="let m of monkeys" [routerLink]="['/monkeys', m.id]">
			<div class="card__media">
				<img [src]="m.imageUrl" [alt]="m.name" loading="lazy" />
				<div class="card__fade"></div>
			</div>
			<div class="card__meta">
				<div class="card__name">{{ m.name }}</div>
				<div class="card__location">{{ m.location }}</div>
			</div>
		</a>
	</div>
	<p class="empty" *ngIf="monkeys.length === 0">No matches. Try a different filter.</p>
</ng-container>

<ng-template #loading>
	<div class="loading surface">
		<div class="loading__bar"></div>
		<p>Loading monkeys…</p>
	</div>
</ng-template>
